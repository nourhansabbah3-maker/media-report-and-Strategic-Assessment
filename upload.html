<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رفع تقرير جديد</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #0a2342;
    --accent: #c8973a;
    --accent-light: #e8b85a;
    --light-bg: #f7f5f0;
    --white: #ffffff;
    --border: #d4c9b0;
    --text-dark: #1a1a2e;
    --text-mid: #3d3d5c;
    --danger: #c0392b;
    --success: #1a6b3c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Cairo', 'Tajawal', sans-serif;
    background: var(--light-bg);
    color: var(--text-dark);
    min-height: 100vh;
  }
  header {
    background: var(--primary);
    color: white;
    padding: 34px 30px;
    text-align: center;
  }
  header h1 { font-size: 22px; font-weight: 900; }
  header p { margin-top: 6px; opacity: 0.7; font-size: 13px; }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 36px 20px 60px;
  }
  .back {
    display: inline-block;
    margin-bottom: 18px;
    color: var(--primary);
    font-size: 13px;
    font-weight: 700;
    text-decoration: none;
  }
  .box {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 20px;
  }
  .box h2 {
    font-size: 15px;
    color: var(--primary);
    margin-bottom: 14px;
    font-weight: 800;
  }
  .box .hint {
    font-size: 12px;
    color: var(--text-mid);
    opacity: 0.75;
    margin-bottom: 16px;
    line-height: 1.7;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 6px;
    color: var(--text-mid);
  }
  input[type=text], input[type=date], input[type=password] {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    margin-bottom: 16px;
    background: var(--light-bg);
  }
  .drop {
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 26px;
    text-align: center;
    font-size: 13px;
    color: var(--text-mid);
    margin-bottom: 16px;
    cursor: pointer;
  }
  .drop.over { border-color: var(--accent); background: rgba(200,151,58,0.06); }
  .drop strong { display: block; margin-bottom: 4px; color: var(--primary); font-size: 14px; }
  button {
    width: 100%;
    background: var(--accent);
    color: var(--primary);
    border: none;
    padding: 13px;
    border-radius: 9px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .status {
    margin-top: 14px;
    font-size: 13px;
    padding: 12px 14px;
    border-radius: 8px;
    display: none;
  }
  .status.ok { display: block; background: rgba(26,107,60,0.1); color: var(--success); }
  .status.err { display: block; background: rgba(192,57,43,0.1); color: var(--danger); }
  .status.loading { display: block; background: rgba(10,35,66,0.06); color: var(--text-mid); }
</style>
</head>
<body>

<header>
  <h1>رفع تقرير جديد</h1>
  <p>وزارة العمل - أرشيف الرصد الإعلامي</p>
</header>

<div class="wrap">
  <a class="back" href="archive.html">→ رجوع للأرشيف</a>

  <div class="box" id="settingsBox">
    <h2>إعدادات الربط بالـ GitHub (مرة واحدة فقط)</h2>
    <div class="hint">
      دي بتتخزن على متصفحك فقط، مش على السيرفر. لازم تعمليها مرة واحدة بس على كل جهاز/متصفح بتستخدميه.
    </div>
    <label>اسم المستخدم أو المنظمة (Owner)</label>
    <input type="text" id="owner" placeholder="مثال: username">
    <label>اسم الـ Repository</label>
    <input type="text" id="repo" placeholder="مثال: media-report-site">
    <label>الفرع (Branch)</label>
    <input type="text" id="branch" value="main">
    <label>Personal Access Token (صلاحية repo)</label>
    <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxx">
    <label>OneSignal REST API Key (اختياري — لإرسال إشعار للوزير)</label>
    <input type="password" id="osKey" placeholder="os_v2_app_xxxxxxxxxxxx">
    <button type="button" id="saveSettings">حفظ الإعدادات</button>
  </div>

  <div class="box">
    <h2>بيانات التقرير</h2>
    <label>عنوان التقرير</label>
    <input type="text" id="title" placeholder="تقرير الرصد الإعلامي - الأسبوع ...">
    <label>تاريخ التقرير</label>
    <input type="date" id="date">
    <label>ملف التقرير (HTML)</label>
    <div class="drop" id="drop">
      <strong>اسحبي الملف هنا أو دوسي للاختيار</strong>
      اللي شكله ملف .html بس
    </div>
    <input type="file" id="fileInput" accept=".html" style="display:none">
    <button type="button" id="uploadBtn" disabled>رفع التقرير</button>
    <div class="status" id="status"></div>
  </div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const S = {
    get: k => localStorage.getItem('ghs_' + k) || '',
    set: (k, v) => localStorage.setItem('ghs_' + k, v)
  };

  $('owner').value = S.get('owner');
  $('repo').value = S.get('repo');
  $('branch').value = S.get('branch') || 'main';
  $('token').value = S.get('token');
  $('osKey').value = S.get('osKey');
  $('date').value = new Date().toISOString().slice(0, 10);

  $('saveSettings').onclick = () => {
    S.set('owner', $('owner').value.trim());
    S.set('repo', $('repo').value.trim());
    S.set('branch', $('branch').value.trim() || 'main');
    S.set('token', $('token').value.trim());
    S.set('osKey', $('osKey').value.trim());
    alert('تم الحفظ ✓');
  };

  let selectedFile = null;
  const drop = $('drop');
  const fileInput = $('fileInput');

  drop.onclick = () => fileInput.click();
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = e => {
    e.preventDefault();
    drop.classList.remove('over');
    if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
  };
  fileInput.onchange = e => { if (e.target.files.length) handleFile(e.target.files[0]); };

  function handleFile(file) {
    selectedFile = file;
    drop.innerHTML = `<strong>${file.name}</strong> جاهز للرفع`;
    $('uploadBtn').disabled = false;
  }

  function showStatus(type, msg) {
    const s = $('status');
    s.className = 'status ' + type;
    s.textContent = msg;
  }

  function toBase64(file) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result.split(',')[1]);
      r.onerror = rej;
      r.readAsDataURL(file);
    });
  }

  async function ghApi(path, method, body) {
    const owner = S.get('owner'), repo = S.get('repo'), token = S.get('token');
    const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
      method,
      headers: {
        'Authorization': 'token ' + token,
        'Accept': 'application/vnd.github+json'
      },
      body: body ? JSON.stringify(body) : undefined
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || 'GitHub API error');
    return data;
  }

  $('uploadBtn').onclick = async () => {
    if (!selectedFile) return;
    const owner = S.get('owner'), repo = S.get('repo'), branch = S.get('branch') || 'main', token = S.get('token');
    if (!owner || !repo || !token) {
      showStatus('err', 'من فضلك احفظي إعدادات الربط بالـ GitHub الأول.');
      return;
    }
    const title = $('title').value.trim() || 'تقرير بدون عنوان';
    const date = $('date').value;
    if (!date) { showStatus('err', 'اختاري تاريخ التقرير.'); return; }

    $('uploadBtn').disabled = true;
    showStatus('loading', 'جاري رفع الملف...');

    try {
      const fileName = 'report-' + date + '.html';
      const b64 = await toBase64(selectedFile);

      // 1) رفع ملف التقرير نفسه
      await ghApi('reports/' + fileName, 'PUT', {
        message: 'إضافة تقرير: ' + title,
        content: b64,
        branch
      });

      // 2) تحديث manifest.json
      showStatus('loading', 'جاري تحديث قائمة التقارير...');
      let manifest = [];
      let sha = null;
      try {
        const current = await ghApi('reports/manifest.json', 'GET');
        sha = current.sha;
        manifest = JSON.parse(decodeURIComponent(escape(atob(current.content))));
      } catch (e) {
        manifest = [];
      }
      manifest = manifest.filter(r => r.file !== fileName);
      manifest.push({ file: fileName, date, title });

      const manifestB64 = btoa(unescape(encodeURIComponent(JSON.stringify(manifest, null, 2))));
      const manifestBody = {
        message: 'تحديث قائمة التقارير',
        content: manifestB64,
        branch
      };
      if (sha) manifestBody.sha = sha;
      await ghApi('reports/manifest.json', 'PUT', manifestBody);

      // إرسال إشعار للمشتركين (لو مفتاح OneSignal متوفر)
      const osKey = S.get('osKey');
      if (osKey) {
        try {
          await fetch('https://onesignal.com/api/v1/notifications', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json; charset=utf-8',
              'Authorization': 'Basic ' + osKey
            },
            body: JSON.stringify({
              app_id: '62e3c160-fc07-4114-8963-ebb321222cf5',
              included_segments: ['Subscribed Users'],
              headings: { ar: 'تقرير رصد إعلامي جديد' },
              contents: { ar: title },
              url: 'https://media-report-and-strategic-assessment.pages.dev'
            })
          });
        } catch (e) { /* فشل إرسال الإشعار لا يوقف عملية الرفع */ }
      }

      showStatus('ok', 'تم رفع التقرير بنجاح ✓ هيظهر على الموقع خلال دقيقة تقريبًا.');
      selectedFile = null;
      $('uploadBtn').disabled = true;
      drop.innerHTML = '<strong>اسحبي الملف هنا أو دوسي للاختيار</strong>اللي شكله ملف .html بس';
    } catch (err) {
      showStatus('err', 'حصل خطأ: ' + err.message);
      $('uploadBtn').disabled = false;
    }
  };
</script>

</body>
</html>
