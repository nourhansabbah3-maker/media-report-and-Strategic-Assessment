<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أرشيف تقارير الرصد الإعلامي - وزارة العمل</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #0a2342;
    --accent: #c8973a;
    --accent-light: #e8b85a;
    --light-bg: #f7f5f0;
    --white: #ffffff;
    --border: #d4c9b0;
    --text-dark: #1a1a2e;
    --text-mid: #3d3d5c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Cairo', 'Tajawal', sans-serif;
    background: var(--light-bg);
    color: var(--text-dark);
    min-height: 100vh;
  }
  header {
    background: var(--primary);
    color: white;
    padding: 40px 30px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    top: -60px; left: -60px;
    width: 250px; height: 250px;
    border-radius: 50%;
    background: rgba(200,151,58,0.12);
  }
  header h1 {
    font-size: 26px;
    font-weight: 900;
    position: relative; z-index: 1;
  }
  header p {
    margin-top: 8px;
    opacity: 0.7;
    font-size: 14px;
    position: relative; z-index: 1;
  }
  .wrap {
    max-width: 800px;
    margin: 0 auto;
    padding: 40px 20px;
  }
  .toolbar {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 20px;
  }
  .toolbar a {
    background: var(--accent);
    color: var(--primary);
    text-decoration: none;
    font-weight: 700;
    font-size: 13px;
    padding: 10px 18px;
    border-radius: 8px;
  }
  .card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    transition: box-shadow .15s ease;
  }
  .card:hover { box-shadow: 0 4px 16px rgba(10,35,66,0.08); }
  .card-title {
    font-weight: 700;
    font-size: 15px;
    color: var(--primary);
    margin-bottom: 4px;
  }
  .card-date {
    font-size: 13px;
    color: var(--text-mid);
    opacity: 0.75;
  }
  .card a.open {
    background: var(--primary);
    color: white;
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
    padding: 9px 16px;
    border-radius: 8px;
    white-space: nowrap;
  }
  .empty {
    text-align: center;
    color: var(--text-mid);
    opacity: 0.7;
    padding: 60px 20px;
    font-size: 14px;
  }
</style>
</head>
<body>

<header>
  <h1>أرشيف تقارير الرصد الإعلامي</h1>
  <p>وزارة العمل - مبادرة مهني 2030</p>
</header>

<div class="wrap">
  <div class="toolbar">
    <a href="upload.html">+ رفع تقرير جديد</a>
  </div>
  <div id="list"></div>
</div>

<script>
  fetch('reports/manifest.json?t=' + Date.now())
    .then(r => r.json())
    .then(reports => {
      const list = document.getElementById('list');
      if (!reports.length) {
        list.innerHTML = '<div class="empty">لا توجد تقارير حتى الآن</div>';
        return;
      }
      reports
        .slice()
        .sort((a, b) => b.date.localeCompare(a.date))
        .forEach(r => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div>
              <div class="card-title">${r.title}</div>
              <div class="card-date">${r.date}</div>
            </div>
            <a class="open" href="reports/${r.file}" target="_blank">فتح التقرير</a>
          `;
          list.appendChild(card);
        });
    })
    .catch(() => {
      document.getElementById('list').innerHTML = '<div class="empty">تعذر تحميل قائمة التقارير</div>';
    });
</script>

</body>
</html>
