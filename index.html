<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تقرير الرصد الإعلامي - آخر إصدار</title>
<style>
  body {
    font-family: 'Cairo', 'Tajawal', sans-serif;
    background: #0a2342;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    text-align: center;
    padding: 20px;
  }
  .msg { font-size: 15px; opacity: 0.8; }
</style>
</head>
<body>
  <div class="msg" id="msg">جاري تحميل آخر تقرير...</div>
  <script>
    fetch('reports/manifest.json?t=' + Date.now())
      .then(r => r.json())
      .then(reports => {
        if (!reports.length) {
          document.getElementById('msg').textContent = 'لا توجد تقارير حتى الآن';
          return;
        }
        const latest = reports.slice().sort((a, b) => b.date.localeCompare(a.date))[0];
        window.location.replace('reports/' + latest.file);
      })
      .catch(() => {
        document.getElementById('msg').textContent = 'تعذر تحميل التقرير';
      });
  </script>
</body>
</html>
